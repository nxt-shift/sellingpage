<!-- @dsCard group="Landing" viewport="1280x900" name="Landing · Pré-lancement" subtitle="Hero + waitlist + circulation" -->
<!DOCTYPE html>
<html lang="fr-ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shift — Embauchez fiable. Saison après saison.</title>
  <link rel="stylesheet" href="../../src/styles.css">
  <link rel="icon" href="../../src/assets/shift-logo.png" type="image/png">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../src/_ds_bundle.js"></script>
  <script type="text/babel" data-plugins="transform-typescript" src="./Sections.tsx"></script>
  <style>body{margin:0}</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-plugins="transform-typescript">
    function App() {
      const [lang, setLang] = React.useState("fr");
      const [joined, setJoined] = React.useState(null);
      const t = STRINGS[lang];
      const onJoin = (email, payload) => {
        if (!email) return;
        setJoined(email);
        setTimeout(() => document.getElementById("waitlist")?.scrollIntoView({behavior:"smooth"}), 50);
      };
      return (
        <>
          <ShiftNav lang={lang} setLang={setLang} t={t} />
          <Hero onJoin={onJoin} t={t} lang={lang} />
          <Problem t={t} />
          <HowItWorks t={t} />
          <Sectors t={t} />
          <WhyNow t={t} />
          <Waitlist onJoin={onJoin} joined={joined} t={t} />
          <CompanyFooter t={t} />
        </>
      );
    }
    // Wait for Sections.tsx to attach globals
    const tryMount = () => {
      if (window.Hero && window.STRINGS) ReactDOM.createRoot(document.getElementById("root")).render(<App />);
      else setTimeout(tryMount, 30);
    };
    tryMount();
  </script>
</body>
</html>
