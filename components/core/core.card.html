<!DOCTYPE html>
<html>
<head>

  <script src="../../_ds_bundle.js"></script>
  <style>
    body { margin: 0; padding: 22px; background: var(--bg-page); font-family: var(--font-body); }
    #root { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    h3 { font-family: var(--font-display); font-weight: 800; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 10px; }

<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Button, Input, Badge, Card } = window.ShiftDesignForLandingPage_3203c0;
    const App = () => (
      <>
        <div className="panel">
          <h3>Buttons</h3>
          <div className="stack">
            <div className="row">
              <Button variant="accent" size="lg">Join the waitlist</Button>

            <div className="row">

            <Badge tone="hazard">Saison</Badge>
            <Badge tone="ink" shape="pill">MVP · 2026</Badge>
            <Badge tone="danger">No-show</Badge>
          </div>
        </div>
        <div className="panel">
          <h3>Cards</h3>
          <div className="row">
            <Card variant="paper" padding={14} style={{flex:1,minWidth:140}}>Paper</Card>
            <Card variant="stamp" padding={14} style={{flex:1,minWidth:140}}>Stamp</Card>
            <Card variant="ink"   padding={14} style={{flex:1,minWidth:140}}>Ink</Card>
