<!-- @dsCard group="Spacing" viewport="700x140" name="Radius scale" subtitle="Crisp by default — pills for chips" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;padding:22px;background:var(--bg-surface);font-family:var(--font-body);}
  .row{display:flex;gap:14px;align-items:center}
  .box{width:72px;height:72px;background:var(--cream-100);border:1.5px solid var(--asphalt-900);display:flex;align-items:flex-end;justify-content:center;padding:6px;font:600 10px var(--font-mono);color:var(--text-muted)}
</style></head><body>
<div class="row">
  <div class="box" style="border-radius:0">none</div>
  <div class="box" style="border-radius:var(--radius-xs)">xs · 4</div>
  <div class="box" style="border-radius:var(--radius-sm)">sm · 6</div>
  <div class="box" style="border-radius:var(--radius-md)">md · 10</div>
  <div class="box" style="border-radius:var(--radius-lg)">lg · 14</div>
  <div class="box" style="border-radius:var(--radius-xl)">xl · 20</div>
  <div class="box" style="border-radius:var(--radius-2xl)">2xl · 28</div>
  <div class="box" style="border-radius:var(--radius-pill)">pill</div>
</div>
</body></html>
