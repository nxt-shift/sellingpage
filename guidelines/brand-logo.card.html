<!-- @dsCard group="Brand" viewport="700x180" name="Logomark" subtitle="The Shift S — use at 28-64px, never larger" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;padding:24px;background:var(--bg-surface);font-family:var(--font-body);display:flex;gap:30px;align-items:center}
  .tile{display:flex;flex-direction:column;align-items:center;gap:10px}
  .tile.dark{background:var(--asphalt-900);padding:18px;border-radius:var(--radius-md)}
  .cap{font:600 10px var(--font-mono);letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase}
  .cap-light{font:600 10px var(--font-mono);letter-spacing:.1em;color:var(--cream-200);text-transform:uppercase}
  img{display:block;image-rendering:auto}
</style></head><body>
  <div class="tile">
    <img src="../assets/shift-logo.png" width="56" height="56" alt="Shift"/>
    <span class="cap">On cream · 56px</span>
  </div>
  <div class="tile">
    <img src="../assets/shift-logo.png" width="32" height="32" alt=""/>
    <span class="cap">Nav · 32px</span>
  </div>
  <div class="tile dark">
    <img src="../assets/shift-logo.png" width="48" height="48" alt=""/>
    <span class="cap-light">On ink · 48px</span>
  </div>
  <div class="tile" style="background:var(--shift-cobalt-500);padding:18px;border-radius:var(--radius-md)">
    <img src="../assets/shift-logo.png" width="48" height="48" alt="" style="background:white;border-radius:6px;padding:2px"/>
    <span class="cap" style="color:var(--cream-50)">On brand</span>
  </div>
  <div style="border-left:1.5px solid var(--asphalt-200);padding-left:24px">
    <div style="font:900 36px var(--font-display);letter-spacing:-.025em;color:var(--asphalt-900);line-height:1">shift</div>
    <div style="font:700 10px var(--font-display);letter-spacing:.18em;color:var(--shift-orange-600);margin-top:4px">FIABLE · QC</div>
  </div>
</body></html>
