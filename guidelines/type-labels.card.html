<!-- @dsCard group="Type" viewport="700x140" name="Eyebrows · Labels" subtitle="Uppercase + tracked — section markers, sector tags" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;padding:22px;background:var(--bg-surface);font-family:var(--font-body);}
  .row{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
  .eyebrow{font:700 12px var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--text-brand)}
  .label{font:600 10px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
  .sector{font:700 11px var(--font-display);letter-spacing:.12em;text-transform:uppercase;padding:6px 10px;background:var(--asphalt-900);color:var(--cream-50);border-radius:4px}
  .stamp{font:900 11px var(--font-display);letter-spacing:.18em;color:var(--shift-orange-600);border:2px solid var(--shift-orange-600);padding:4px 8px;border-radius:3px;display:inline-block;transform:rotate(-2deg)}
</style></head><body>
  <div class="row" style="margin-bottom:18px">
    <span class="eyebrow">01 · The Problem</span>
    <span class="eyebrow" style="color:var(--text-accent)">Pre-launch</span>
    <span class="label">Updated 23 jun 2026</span>
  </div>
  <div class="row">
    <span class="sector">Paysagement</span>
    <span class="sector" style="background:var(--shift-cobalt-500)">Agriculture</span>
    <span class="sector" style="background:var(--shift-orange-500);color:var(--asphalt-900)">Déménagement</span>
    <span class="stamp">FIABLE</span>
  </div>
</body></html>
