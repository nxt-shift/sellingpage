<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;padding:22px;background:var(--bg-surface);font-family:var(--font-body);color:var(--text-strong);}
  .stack{display:flex;flex-direction:column;gap:4px}
  .row{display:flex;align-items:baseline;gap:14px}
  .label{font:600 10px var(--font-mono);letter-spacing:.1em;color:var(--text-muted);width:90px;flex:none}
  .specimen{font-family:var(--font-display);font-weight:900;letter-spacing:-.025em;line-height:1.02;color:var(--text-strong)}
</style></head><body>
<div class="stack">
  <div class="row"><span class="label">7xl · 120</span><span class="specimen" style="font-size:88px">Fiable.</span></div>
  <div class="row"><span class="label">5xl · 64</span><span class="specimen" style="font-size:56px">Hire for the season.</span></div>
  <div class="row"><span class="label">3xl · 36</span><span class="specimen" style="font-size:36px">A workforce that circulates.</span></div>
  <div class="row"><span class="label">xl · 22</span><span class="specimen" style="font-size:22px;font-weight:800">Built for blue collar Quebec.</span></div>
</div>
</body></html>
