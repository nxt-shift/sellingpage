<!-- @dsCard group="Colors" viewport="700x140" name="Semantic" subtitle="Reliable green, hazard yellow, danger, info" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;padding:20px;background:var(--bg-surface);font-family:var(--font-body);}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .sw{padding:14px;border-radius:var(--radius-md);color:var(--cream-50)}
  .sw b{display:block;font:900 18px var(--font-display);letter-spacing:-.01em}
  .sw span{font:500 12px var(--font-mono);opacity:.85}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--reliable-500)"><b>Reliable</b><span>--reliable-500</span></div>
  <div class="sw" style="background:var(--hazard-yellow-500);color:var(--asphalt-900)"><b>Hazard</b><span>--hazard-yellow-500</span></div>
  <div class="sw" style="background:var(--danger-500)"><b>Danger</b><span>--danger-500</span></div>
  <div class="sw" style="background:var(--quebec-blue-500)"><b>Info · QC</b><span>--quebec-blue-500</span></div>
</div>
</body></html>
