<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base — generous gaps win" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;padding:22px;background:var(--bg-surface);font-family:var(--font-body);}
  .row{display:flex;align-items:flex-end;gap:8px;height:90px}
  .step{display:flex;flex-direction:column;align-items:center;gap:6px;font:600 10px var(--font-mono);color:var(--text-muted)}
  .bar{background:var(--shift-cobalt-500);width:18px;border-radius:2px}
</style></head><body>
<div class="row">
  <div class="step"><div class="bar" style="height:4px"></div>1</div>
  <div class="step"><div class="bar" style="height:8px"></div>2</div>
  <div class="step"><div class="bar" style="height:12px"></div>3</div>
  <div class="step"><div class="bar" style="height:16px"></div>4</div>
  <div class="step"><div class="bar" style="height:24px"></div>6</div>
  <div class="step"><div class="bar" style="height:32px"></div>8</div>
  <div class="step"><div class="bar" style="height:48px"></div>12</div>
  <div class="step"><div class="bar" style="height:64px"></div>16</div>
  <div class="step"><div class="bar" style="height:80px"></div>20</div>
</div>
</body></html>
