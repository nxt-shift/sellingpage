<!-- @dsCard group="Colors" viewport="700x160" name="Brand · Cobalt" subtitle="Primary — sampled from the Shift logomark" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;padding:20px;background:var(--bg-surface);font-family:var(--font-body);}
  .row{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;}
  .sw{aspect-ratio:1;border-radius:var(--radius-sm);position:relative;border:1px solid rgba(0,0,0,.04);}
  .sw span{position:absolute;left:6px;bottom:4px;font:600 10px var(--font-mono);color:var(--cream-50);mix-blend-mode:difference;}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--shift-cobalt-50)"><span style="color:var(--asphalt-900);mix-blend-mode:normal">50</span></div>
  <div class="sw" style="background:var(--shift-cobalt-100)"><span style="color:var(--asphalt-900);mix-blend-mode:normal">100</span></div>
  <div class="sw" style="background:var(--shift-cobalt-200)"><span>200</span></div>
  <div class="sw" style="background:var(--shift-cobalt-300)"><span>300</span></div>
  <div class="sw" style="background:var(--shift-cobalt-400)"><span>400</span></div>
  <div class="sw" style="background:var(--shift-cobalt-500);outline:2px solid var(--asphalt-900);outline-offset:2px"><span>500</span></div>
  <div class="sw" style="background:var(--shift-cobalt-600)"><span>600</span></div>
  <div class="sw" style="background:var(--shift-cobalt-700)"><span>700</span></div>
  <div class="sw" style="background:var(--shift-cobalt-900)"><span>900</span></div>
</div>
</body></html>
