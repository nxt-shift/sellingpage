<!-- @dsCard group="Spacing" viewport="700x160" name="Elevation" subtitle="Restrained shadows + stamp (offset hard shadow)" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;padding:30px;background:var(--bg-page);font-family:var(--font-body);}
  .row{display:flex;gap:30px;align-items:center}
  .box{width:90px;height:60px;background:var(--bg-surface);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font:600 10px var(--font-mono);color:var(--text-muted)}
  .stamp{background:var(--shift-orange-500);color:var(--asphalt-900);border:2px solid var(--asphalt-900);box-shadow:var(--shadow-stamp);font-weight:700}
</style></head><body>
<div class="row">
  <div class="box" style="box-shadow:var(--shadow-xs)">xs</div>
  <div class="box" style="box-shadow:var(--shadow-sm)">sm</div>
  <div class="box" style="box-shadow:var(--shadow-md)">md</div>
  <div class="box" style="box-shadow:var(--shadow-lg)">lg</div>
  <div class="box stamp">stamp</div>
</div>
</body></html>
