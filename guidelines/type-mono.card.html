<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;padding:22px;background:var(--bg-surface);font-family:var(--font-body);color:var(--text-body);}
  .row{display:flex;align-items:center;gap:14px;margin-bottom:8px;font-family:var(--font-mono)}
  .label{font:600 10px var(--font-mono);letter-spacing:.1em;color:var(--text-muted);width:90px;flex:none;text-transform:uppercase}
  code{font-family:var(--font-mono);background:var(--cream-100);padding:4px 8px;border-radius:4px;color:var(--text-strong)}
</style></head><body>
  <div class="row"><span class="label">Big stat</span><span style="font:700 32px var(--font-mono);color:var(--text-strong);letter-spacing:-.01em">$1,240.00</span><span style="font-size:13px;color:var(--text-muted)">paid out this week</span></div>
  <div class="row"><span class="label">Timestamp</span><code>2026-05-12 07:14:22 EDT</code><code>GPS · 45.5019° N · 73.5674° W</code></div>
  <div class="row"><span class="label">Token</span><code>--shift-cobalt-500</code><code>SHIFT-MTL-04812</code></div>
</body></html>
