<!-- @dsCard group="Colors" viewport="700x180" name="Neutrals · Asphalt + Cream" subtitle="Ink ramp + warm paper background" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;padding:20px;background:var(--bg-surface);font-family:var(--font-body);}
  h4{font:700 10px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);margin:0 0 6px}
  .row{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-bottom:10px}
  .sw{aspect-ratio:1;border-radius:var(--radius-sm);position:relative;border:1px solid var(--border-hair)}
  .sw span{position:absolute;left:5px;bottom:3px;font:600 9px var(--font-mono)}
</style></head><body>
<h4>Asphalt</h4>
<div class="row">
  <div class="sw" style="background:var(--asphalt-0)"><span>0</span></div>
  <div class="sw" style="background:var(--asphalt-50)"><span>50</span></div>
  <div class="sw" style="background:var(--asphalt-100)"><span>100</span></div>
  <div class="sw" style="background:var(--asphalt-200)"><span>200</span></div>
  <div class="sw" style="background:var(--asphalt-300)"><span>300</span></div>
  <div class="sw" style="background:var(--asphalt-400)"><span style="color:var(--cream-50)">400</span></div>
  <div class="sw" style="background:var(--asphalt-500)"><span style="color:var(--cream-50)">500</span></div>
  <div class="sw" style="background:var(--asphalt-700)"><span style="color:var(--cream-50)">700</span></div>
  <div class="sw" style="background:var(--asphalt-800)"><span style="color:var(--cream-50)">800</span></div>
  <div class="sw" style="background:var(--asphalt-900)"><span style="color:var(--cream-50)">900</span></div>
</div>
<h4>Cream (warm paper)</h4>
<div class="row" style="grid-template-columns:repeat(5,1fr);max-width:50%">
  <div class="sw" style="background:var(--cream-50)"><span>50</span></div>
  <div class="sw" style="background:var(--cream-100)"><span>100</span></div>
  <div class="sw" style="background:var(--cream-200)"><span>200</span></div>
  <div class="sw" style="background:var(--cream-300)"><span>300</span></div>
  <div class="sw" style="background:var(--cream-400)"><span>400</span></div>
</div>
</body></html>
