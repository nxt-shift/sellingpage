<!-- @dsCard group="Colors" viewport="700x160" name="Accent · Hi-Vis Orange" subtitle="Secondary — urgency, hazard, the seasonal panic moment" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;padding:20px;background:var(--bg-surface);font-family:var(--font-body);}
  .row{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
  .sw{aspect-ratio:1.2;border-radius:var(--radius-sm);position:relative;}
  .sw span{position:absolute;left:8px;bottom:6px;font:600 11px var(--font-mono);color:var(--asphalt-900)}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--shift-orange-50)"><span>50</span></div>
  <div class="sw" style="background:var(--shift-orange-100)"><span>100</span></div>
  <div class="sw" style="background:var(--shift-orange-300)"><span>300</span></div>
  <div class="sw" style="background:var(--shift-orange-500);outline:2px solid var(--asphalt-900);outline-offset:2px"><span>500</span></div>
  <div class="sw" style="background:var(--shift-orange-600)"><span style="color:var(--cream-50)">600</span></div>
  <div class="sw" style="background:var(--shift-orange-700)"><span style="color:var(--cream-50)">700</span></div>
</div>
</body></html>
